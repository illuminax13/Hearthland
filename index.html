<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Hearthland</title>
    <meta
      name="description"
      content="Hearthland is a generational farming life sim. One family, one farm, a century of choices."
    />
    <meta name="theme-color" content="#17130f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hearthland" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
  </head>
  <body>
    <div id="app">
      <canvas id="view" aria-label="Hearthland farm"></canvas>
      <div id="hud"></div>
      <div id="touch">
        <div class="pad" role="group" aria-label="Walk">
          <button type="button" data-dir="n" aria-label="North">▲</button>
          <button type="button" data-dir="w" aria-label="West">◀</button>
          <button type="button" data-dir="e" aria-label="East">▶</button>
          <button type="button" data-dir="s" aria-label="South">▼</button>
        </div>
        <div class="touch-side">
          <button type="button" id="touch-compost">Compost</button>
          <button type="button" id="touch-use">Use</button>
        </div>
      </div>
      <div id="overlay"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
